name: Custom build

on:
  push:
    branches:
      - 'deepshark/**'
    paths:
      - 'custom/**'
      - 'src/FlightDisplay/**'
      - 'src/Comms/LinkManager.cc'
      - 'src/QGCApplication.cc'
      - 'src/UI/AppSettings/VideoSettings.qml'
      - 'tools/ai_detection/**'
      - 'test/DeepShark/**'
      - 'test/CMakeLists.txt'
      - 'test/UnitTestList.cc'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/custom.yml'
  pull_request:
    paths:
      - 'custom/**'
      - 'src/FlightDisplay/**'
      - 'src/Comms/LinkManager.cc'
      - 'src/QGCApplication.cc'
      - 'src/UI/AppSettings/VideoSettings.qml'
      - 'tools/ai_detection/**'
      - 'test/DeepShark/**'
      - 'test/CMakeLists.txt'
      - 'test/UnitTestList.cc'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/custom.yml'
  workflow_dispatch:

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        BuildType: [Debug, Release]
        Arch: [x64]

    defaults:
      run:
        shell: cmd

    env:
      ARTIFACT: QGC_KevinJiang.exe
      QT_VERSION: 6.8.3
      GST_VERSION: 1.22.12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Verify DeepShark custom build
        run: |
          if not exist ".\custom\CMakeLists.txt" (
            echo DeepShark custom build is missing. && exit /b 1
          )

      - name: Run AI bridge unit tests
        run: python -m unittest discover -s tools\ai_detection\tests -p "test_*.py"

      - name: Install GStreamer
        uses: blinemedical/setup-gstreamer@v1
        with:
          version: ${{ env.GST_VERSION }}

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: windows
          target: win64_msvc2022_64
          build-type: ${{ matrix.BuildType }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Install Qt for Windows (x64)
        if: matrix.Arch == 'x64'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DQGC_BUILD_TESTING=${{ matrix.BuildType == 'Debug' && 'ON' || 'OFF' }}
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      - name: Run DeepShark tests
        if: matrix.BuildType == 'Debug'
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: |
          set QT_QPA_PLATFORM=windows
          set QT_QUICK_BACKEND=software
          ctest --test-dir test -R "^(AIDetectionReceiverTest|DeepSharkVideoControllerTest|ThrusterDirectControlControllerTest)$" --output-on-failure --timeout 30
